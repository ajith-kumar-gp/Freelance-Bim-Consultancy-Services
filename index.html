<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIM Earth Consultancy - Architecture, Interior Design & Lifecycle BIM</title>

    <!-- Favicons (Google search needs a square icon, multiple of 48px) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1565c0" />

    <!-- Organization logo for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BIM Earth Consultancy",
        "url": "https://bimearthconsultancy.com",
        "logo": "https://bimearthconsultancy.com/android-chrome-512x512.png"
      }
    </script>

    <!-- SEO and Social Metadata -->
    <meta name="description" content="Premium corporate consultancy providing luxury Architecture, bespoke Interior Design, and Lifecycle LOD 500 MEP & Structural BIM coordination for elite commercial and residential projects." />
    <meta name="keywords" content="BIM, Building Information Modeling, Architectural Design, Interior Design, MEP coordination, Structural BIM, Digital Twin, BIM Earth" />
    <meta name="author" content="BIM Earth Consultancy" />
    
    <!-- OpenGraph Shared Tags -->
    <meta property="og:title" content="BIM Earth Consultancy - Digital Architecture & Engineering" />
    <meta property="og:description" content="We combine beautiful architectural design with clash-free LOD 500 BIM virtual engineering systems to construct zero-error, sustainable corporate projects." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80" />
    
    <!-- Twitter Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BIM Earth Consultancy" />
    <meta name="twitter:description" content="High-fidelity Architecture, Interior Design, and unified BIM coordinate consulting." />
    
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
